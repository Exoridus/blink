name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: Core checks (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
  core-gate:
    name: Core checks
    needs: core
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require both platform checks
        env:
          CORE_RESULT: ${{ needs.core.result }}
        run: test "$CORE_RESULT" = success
  policy:
    name: Commit policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HUSKY: '0'
      POLICY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Check commits and PR text
        shell: bash
        run: |
          if [[ "$POLICY_BASE" =~ ^0+$ || -z "$POLICY_BASE" ]]; then
            POLICY_BASE=$(node scripts/lib/policyBase.ts HEAD origin)
          fi
          node scripts/check-commits.ts "$POLICY_BASE"
          node scripts/check-repository-policy.ts "$POLICY_BASE"
