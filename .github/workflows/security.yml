name: Secret audit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install checksum-pinned scanner
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/blink-gitleaks"
          cd "$RUNNER_TEMP/blink-gitleaks"
          curl --fail --location --silent --show-error --output scanner.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  scanner.tar.gz' | sha256sum --check
          tar -xzf scanner.tar.gz gitleaks
      - name: Scan full history
        run: '"$RUNNER_TEMP/blink-gitleaks/gitleaks" git --redact --log-opts=--all'
