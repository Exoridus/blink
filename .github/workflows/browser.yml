name: Browser and GPU
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  webgl:
    name: Browser WebGL2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:showcase:gpu
      - run: npm run build:pages
      - run: npm run test:showcase:browser
      - run: npm run test:demo:browser
      - run: npm run build:local
      - name: Root build browser smoke
        run: npm run test:browser
        env:
          BLINK_SMOKE_ARTIFACT: dist/local
          BLINK_SMOKE_BASE: /
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-webgl2
          path: .workspace/artifacts/browser
  hardware:
    name: Optional hardware WebGPU
    if: github.event_name == 'workflow_dispatch' && vars.BLINK_HARDWARE_TESTS_ENABLED == 'true'
    runs-on: [self-hosted, blink-gpu]
    timeout-minutes: 15
    env:
      HUSKY: '0'
      BLINK_SMOKE_BACKEND: webgpu
      BLINK_SMOKE_ARTIFACT: dist/local
      BLINK_SMOKE_BASE: /
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install chromium
      - run: npm run build:local
      - run: npm run test:browser
